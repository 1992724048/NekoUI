<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 准星光标：细十字线贯穿 + 中心圆点，白色主体 + 黑色描边，深浅主题背景均可辨识；hotspot 中心 (12,12) -->
  <g stroke="#111111" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="12" x2="24" y2="12" />
    <line x1="12" y1="0" x2="12" y2="24" />
  </g>
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
    <line x1="0" y1="12" x2="24" y2="12" />
    <line x1="12" y1="0" x2="12" y2="24" />
  </g>
  <circle cx="12" cy="12" r="2" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
</svg>
